<!doctype html>
<html>
  <body style="margin:0;background:#f5f5f7;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1d1d1f;">
    <div style="max-width:560px;margin:0 auto;padding:32px 20px;">
      <h1 style="font-size:22px;margin:0 0 8px;">How are your new looks?</h1>
      <p style="font-size:15px;line-height:1.6;color:#5b5f66;">
        Thanks again for your purchase. We'd love to hear how it's going — a quick
        review helps other creators choose with confidence.
      </p>
      <div style="margin:24px 0;">
        {% for p in products %}
        <a href="{{ p.url }}"
           style="display:block;background:#ffffff;border:1px solid #e6e6eb;border-radius:14px;padding:14px 18px;margin-bottom:10px;text-decoration:none;color:#1d1d1f;font-weight:600;">
          Review {{ p.title }} &rarr;
        </a>
        {% endfor %}
      </div>
      <p style="font-size:13px;color:#8a8d93;">The Looks Lab &middot;
        <a href="{{ site_url }}" style="color:#0071e3;">{{ site_url }}</a>
      </p>
    </div>
  </body>
</html>
